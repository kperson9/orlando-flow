name: Publish Orlando itinerary

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-orlando-itinerary.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish public itinerary
        env:
          ROUTE_B64: |
            
        run: |
          python - <<'PY'
          import base64, gzip, json, os
          from pathlib import Path

          raw = gzip.decompress(base64.b64decode(os.environ['ROUTE_B64']))
          data = json.loads(raw.decode('utf-8'))
          assert data['tripName'] == 'Orlando - Setembro 2026 - Roteiro Final'
          assert len(data['days']) == 11
          assert sum(len(day['activities']) for day in data['days']) == 218
          assert {day['park'] for day in data['days']} >= {
              'animal-kingdom','hollywood-studios','magic-kingdom','epcot',
              'epic-universe','islands-of-adventure','universal-studios-florida'
          }
          text = json.dumps(data, ensure_ascii=False, indent=2) + '\n'
          Path('data').mkdir(exist_ok=True)
          Path('data/sample-itinerary.json').write_text(text, encoding='utf-8')
          Path('data/orlando-setembro-2026-itinerary.json').write_text(text, encoding='utf-8')

          sw = Path('sw.js')
          source = sw.read_text(encoding='utf-8')
          source = source.replace('orlando-flow-static-v41-4-4-final', 'orlando-flow-static-v41-4-4-route-20260901')
          source = source.replace('orlando-flow-runtime-v41-4-4-final', 'orlando-flow-runtime-v41-4-4-route-20260901')
          sw.write_text(source, encoding='utf-8')
          PY

      - name: Commit itinerary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sample-itinerary.json data/orlando-setembro-2026-itinerary.json sw.js
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Publish Orlando September 2026 itinerary"
          git push
